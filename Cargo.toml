[package]
name = "mathy"
version = "0.1.0"
edition = "2021"
authors = ["Błyskawica & Mathy Team"]
description = "Błyskawica Mathy: Physics & Spectral Topology Engine for Code Intelligence (COBOL to Spectral/PINN/GR)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[profile.dev]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
debug = false

[profile.test.build-override]
debug = false

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
debug = false
